<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>for you</title>
<meta name="description" content="tap to bloom">
<meta property="og:title" content="for you">
<meta property="og:description" content="tap to bloom">
<meta name="theme-color" content="#120a13">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one dark screen; the turning bouquet fills the stage, a florist's card sits beneath it */
:root {
  --ink: #120a13;      /* night plum ground */
  --halo: #331329;     /* glow behind the flowers */
  --petal: #f6c3d6;    /* stargazer pink */
  --pollen: #e9a35e;   /* anther orange */
  --card: #a08497;     /* florist's card text */
  --font-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html { height: 100%; box-sizing: border-box; background: var(--ink); }
body {
  height: 100%;
  box-sizing: border-box;
  margin: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  padding-block: calc(8px + env(safe-area-inset-top, 0px)) calc(14px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: radial-gradient(ellipse 62% 54% at 50% 44%, var(--halo), var(--ink) 72%) var(--ink);
  color: var(--petal);
  font-family: var(--font-mono);
}
.stage {
  flex: 1 1 auto;
  min-height: 0;
  position: relative;
  touch-action: none;
  cursor: grab;
  outline: none;
  border-radius: 12px;
}
.stage.dragging { cursor: grabbing; }
.stage:focus-visible { box-shadow: 0 0 0 1px var(--petal); }
#bouquet { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.card {
  flex: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding-top: 2px;
}
.banner {
  margin: 0;
  font: 500 clamp(8px, 1.45vh, 12px) / 1.08 var(--font-mono);
  white-space: pre;
  background: linear-gradient(100deg, var(--petal) 25%, var(--pollen) 90%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.note {
  margin: 0;
  font-size: 12px;
  line-height: 1.6;
  letter-spacing: 0.18em;
  color: var(--card);
  text-align: center;
}
.waiting .note { animation: breathe 2.4s ease-in-out infinite; }
@keyframes breathe { 50% { color: var(--petal); } }
@media (prefers-reduced-motion: reduce) { .waiting .note { animation: none; } }
@media (max-height: 540px) { .banner { display: none; } }
</style>
</head>
<body>

<div class="stage" id="stage" tabindex="0" aria-label="Bouquet of oriental lilies. Drag or use the arrow keys to turn it. Press Enter to make the lilies bloom again.">
  <canvas id="bouquet" role="img" aria-label="An ASCII-art bouquet of pink Stargazer oriental lilies with red and blush roses, buds and baby's breath, wrapped in kraft paper and tied with a wine-red ribbon, slowly turning."></canvas>
</div>
<div class="card">
<pre class="banner" role="img" aria-label="for you">
 _
| |
| |  __   ,_            __
|/  /  \_/  |    |   | /  \_|   |
|__/\__/    |_/   \_/|/\__/  \_/|_/
|\                  /|
|/                  \|</pre>
<p class="note">tap to bloom</p>
</div>

<script>
(() => {
  'use strict';
  const stage = document.getElementById('stage');
  const canvas = document.getElementById('bouquet');
  const ctx = canvas.getContext('2d');
  const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const RAMP = '.,-~:;=+*#%@';
  // each material gets its own glyphs: flowers dense, foliage and paper light, baby's breath sparkly
  const RAMPS = [];
  for (let id = 0; id < 320; id++) {
    RAMPS[id] =
      id >= 200 ? ':;o%%@@' :                                   // roses
      id >= 100 ? (id % 8 >= 6 ? RAMP : '-=+*#%%@@') :           // lily tepals; stamens and pistil
      id >= 60 ? '.+***' :                                       // baby's breath
      id >= 50 ? ':=+#%%' :                                      // ribbon
      id >= 40 ? ':=+*#%' :                                      // buds
      id === 1 || id === 2 ? '.,:-;=+*' :                        // kraft and tissue paper
      '.,-~:;=+*';                                               // leaves, moss, stems
  }
  const FONT = '"DM Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace';
  const TAU = Math.PI * 2;

  // ---------- small math ----------
  const clamp01 = v => (v < 0 ? 0 : v > 1 ? 1 : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = (a, b, x) => { const t = clamp01((x - a) / (b - a)); return t * t * (3 - 2 * t); };
  const mix3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
  const norm = v => { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; };
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const add = (a, b, s = 1) => [a[0] + b[0] * s, a[1] + b[1] * s, a[2] + b[2] * s];
  const hash = (a, b, c = 0) => { const s = Math.sin(a * 127.1 + b * 311.7 + c * 74.7) * 43758.5453; return s - Math.floor(s); };
  const rng = seed => () => {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const basis = f => { const up = Math.abs(f[1]) < 0.92 ? [0, 1, 0] : [1, 0, 0]; const e1 = norm(cross(up, f)); return [e1, cross(f, e1)]; };
  const bez = (p0, p1, p2) => t => {
    const u = 1 - t;
    return [u * u * p0[0] + 2 * u * t * p1[0] + t * t * p2[0], u * u * p0[1] + 2 * u * t * p1[1] + t * t * p2[1], u * u * p0[2] + 2 * u * t * p1[2] + t * t * p2[2]];
  };

  // ---------- point clouds: position, normal, front colour, back colour, shine, part id ----------
  // The part id lets the renderer draw a soft outline wherever one part passes in front of another.
  const STRIDE = 14;
  class Cloud {
    constructor() { this.a = new Float32Array(STRIDE * 8192); this.n = 0; this.obj = 0; }
    reset() { this.n = 0; }
    push(x, y, z, nx, ny, nz, fr, fg, fb, br, bg, bb, sh) {
      if ((this.n + 1) * STRIDE > this.a.length) { const t = new Float32Array(this.a.length * 2); t.set(this.a); this.a = t; }
      const l = Math.hypot(nx, ny, nz) || 1, a = this.a, o = this.n++ * STRIDE;
      a[o] = x; a[o + 1] = y; a[o + 2] = z;
      a[o + 3] = nx / l; a[o + 4] = ny / l; a[o + 5] = nz / l;
      a[o + 6] = fr; a[o + 7] = fg; a[o + 8] = fb;
      a[o + 9] = br; a[o + 10] = bg; a[o + 11] = bb;
      a[o + 12] = sh;
      a[o + 13] = this.obj;
    }
  }

  const C = {
    white: [255, 244, 248], blush: [248, 176, 204], magenta: [212, 30, 104], freckle: [118, 10, 44],
    throat: [196, 214, 112], sgBack: [246, 204, 222],
    cream: [255, 251, 240], stripe: [222, 226, 140], cbBack: [236, 242, 222],
    filament: [214, 232, 190], anther: [176, 64, 24], style: [168, 204, 120], stigma: [128, 92, 108],
    stem: [86, 146, 70], leaf: [70, 132, 60], leafLight: [122, 180, 92], leafBack: [92, 128, 80], vein: [164, 208, 130],
    bud: [124, 176, 96], budTip: [232, 160, 186],
    red: [222, 44, 74], redIn: [186, 24, 54], blush: [255, 204, 212], blushIn: [246, 164, 186],
    moss: [38, 80, 42], moss2: [72, 120, 58], breath: [252, 250, 242],
    kraft: [222, 180, 132], kraftIn: [160, 122, 86], tissue: [246, 198, 212], tissueIn: [226, 166, 186],
    ribbon: [160, 22, 58], ribbonIn: [112, 14, 40],
  };

  // ---------- the arrangement ----------
  // az: angle around the bouquet (pi/2 faces you at the start), el: how far each face tips up
  // four big blooms tipped outwards around the bouquet, one crowning the top
  const LILIES = [
    { az: 1.6, rad: 0.55, y: 0.12, el: 0.5, kind: 'stargazer', size: 1.5 },
    { az: 3.1, rad: 0.55, y: 0.24, el: 0.6, kind: 'stargazer', size: 1.42 },
    { az: 4.75, rad: 0.55, y: 0.14, el: 0.52, kind: 'stargazer', size: 1.48 },
    { az: 0.1, rad: 0.55, y: 0.26, el: 0.6, kind: 'stargazer', size: 1.42 },
    { az: 1.2, rad: 0.14, y: 0.62, el: 1.05, kind: 'stargazer', size: 1.4 },
  ];
  LILIES.forEach((L, i) => {
    L.c = [L.rad * Math.cos(L.az), L.y, L.rad * Math.sin(L.az)];
    L.f = norm([Math.cos(L.el) * Math.cos(L.az), Math.sin(L.el), Math.cos(L.el) * Math.sin(L.az)]);
    L.twist = hash(i, 3) * TAU;
    L.delay = i * 0.06;
    L.id = i;
  });
  const BUDS = [
    { az: 2.9, rad: 0.3, y: 0.62, lean: 0.3, len: 0.44 },
    { az: 4.2, rad: 0.28, y: 0.6, lean: 0.35, len: 0.4 },
    { az: 5.9, rad: 0.3, y: 0.58, lean: 0.4, len: 0.38 },
  ];
  // roses set up in the gaps between the lilies, level with the blooms
  const ROSES = [
    { az: 0.85, kind: 'red' }, { az: 2.35, kind: 'blush' }, { az: 3.92, kind: 'red' }, { az: 5.45, kind: 'blush' },
  ].map((R, i) => {
    const el = 0.68, rad = 0.56, y = 0.32 + (i % 2) * 0.08;
    return {
      ...R, id: i, size: 1.2, delay: 0.08 + i * 0.05, twist: hash(i, 21) * TAU,
      c: [rad * Math.cos(R.az), y, rad * Math.sin(R.az)],
      f: norm([Math.cos(el) * Math.cos(R.az), Math.sin(el), Math.cos(el) * Math.sin(R.az)]),
    };
  });
  BUDS.forEach((B, i) => {
    B.base = [B.rad * Math.cos(B.az), B.y, B.rad * Math.sin(B.az)];
    B.d = norm([Math.sin(B.lean) * Math.cos(B.az), Math.cos(B.lean), Math.sin(B.lean) * Math.sin(B.az)]);
    B.twist = hash(i, 9) * TAU;
  });
  const LEAVES = [];
  {
    const R = rng(3);
    for (let i = 0; i < 8; i++) {
      const az = (i / 8) * TAU + 0.3 + R() * 0.4, el = 0.3 + R() * 0.4;
      LEAVES.push({
        B: [0.55 * Math.cos(az), -0.3, 0.55 * Math.sin(az)],
        D: norm([Math.cos(el) * Math.cos(az), Math.sin(el), Math.cos(el) * Math.sin(az)]),
        len: 0.55 + R() * 0.25, w: 0.075 + R() * 0.03, droop: 0.25 + R() * 0.3, fold: 0.35, tone: R(),
      });
    }
  }

  // ---------- shape builders ----------
  let Q = 1; // sampling density, follows the character grid size

  function tube(cl, path, radius, col, n, m, shine) {
    for (let i = 0; i <= n; i++) {
      const t = i / n, p = path(t), a = path(Math.min(1, t + 0.01)), b = path(Math.max(0, t - 0.01));
      const [u, v] = basis(norm([a[0] - b[0], a[1] - b[1], a[2] - b[2]]));
      for (let j = 0; j < m; j++) {
        const ang = (j / m) * TAU, ca = Math.cos(ang), sa = Math.sin(ang);
        const nx = u[0] * ca + v[0] * sa, ny = u[1] * ca + v[1] * sa, nz = u[2] * ca + v[2] * sa;
        cl.push(p[0] + nx * radius, p[1] + ny * radius, p[2] + nz * radius, nx, ny, nz, col[0], col[1], col[2], col[0], col[1], col[2], shine);
      }
    }
  }

  function ellipsoid(cl, c, ax, ra, rb, col, shine, nu, nv) {
    const [p, q] = basis(ax);
    for (let i = 0; i <= nu; i++) {
      const th = (i / nu) * Math.PI, ct = Math.cos(th), st = Math.sin(th);
      for (let j = 0; j < nv; j++) {
        const ph = (j / nv) * TAU, cp = Math.cos(ph), sp = Math.sin(ph);
        const rx = p[0] * cp + q[0] * sp, ry = p[1] * cp + q[1] * sp, rz = p[2] * cp + q[2] * sp;
        cl.push(
          c[0] + ax[0] * ct * ra + rx * st * rb, c[1] + ax[1] * ct * ra + ry * st * rb, c[2] + ax[2] * ct * ra + rz * st * rb,
          ax[0] * ct / ra + rx * st / rb, ax[1] * ct / ra + ry * st / rb, ax[2] * ct / ra + rz * st / rb,
          col[0], col[1], col[2], col[0], col[1], col[2], shine);
      }
    }
  }

  // Tepal colours depend only on where you are on the tepal, so they are worked out once.
  function tepalColours(L, nu, nv) {
    const star = L.kind === 'stargazer', out = new Float32Array(6 * (nu + 1) * (nv + 1) * 6);
    let o = 0;
    for (let k = 0; k < 6; k++) for (let i = 0; i <= nu; i++) for (let j = 0; j <= nv; j++) {
      const u = i / nu, v = (j / nv) * 2 - 1, av = Math.abs(v);
      let col, back;
      if (star) {
        const along = smooth(0.03, 0.3, u) * (1 - 0.6 * smooth(0.72, 1, u));
        col = mix3(C.white, C.blush, Math.exp(-(v * v) / 0.8) * along * 0.85);
        col = mix3(col, C.magenta, Math.exp(-(v * v) / 0.22) * along * 0.92);
        col = mix3(col, C.throat, (1 - smooth(0, 0.17, u)) * 0.85);
        col = mix3(col, C.white, smooth(0.8, 1, av) * 0.6);
        // the dark raised freckles stargazers are known for
        if (u > 0.1 && u < 0.64 && av < 0.72) {
          const gu = u * 16, gv = (v + 1) * 4.5, iu = Math.floor(gu), iv = Math.floor(gv);
          if (hash(iu, iv, k * 7 + L.id * 13) < 0.42) {
            const du = gu - iu - 0.5 - (hash(iv, iu, L.id) - 0.5) * 0.4, dv = gv - iv - 0.5;
            if (du * du + dv * dv < 0.14) col = C.freckle;
          }
        }
        back = mix3(C.sgBack, C.throat, (1 - smooth(0, 0.22, u)) * 0.7);
      } else {
        col = mix3(C.cream, C.stripe, Math.exp(-(v * v) / 0.03) * (1 - smooth(0.08, 0.55, u)) * 0.8);
        col = mix3(col, C.throat, (1 - smooth(0, 0.14, u)) * 0.7);
        back = mix3(C.cbBack, C.throat, (1 - smooth(0, 0.2, u)) * 0.5);
      }
      out[o++] = col[0]; out[o++] = col[1]; out[o++] = col[2];
      out[o++] = back[0]; out[o++] = back[1]; out[o++] = back[2];
    }
    return out;
  }

  // One oriental lily: six recurved tepals, six stamens with rust anthers, and a pistil.
  // bloom 0 = closed bud, 1 = fully open.
  function lily(cl, L, bloom) {
    const s = L.size, f = L.f, c = L.c, [e1, e2] = basis(f), b = smooth(0, 1, bloom);
    const nu = Math.ceil(46 * Q), nv = Math.ceil(24 * Q);
    if (!L.cols || L.colsQ !== Q) { L.cols = tepalColours(L, nu, nv); L.colsQ = Q; }
    const cols = L.cols, rr = new Float32Array(nu + 1), hh = new Float32Array(nu + 1), th = new Float32Array(nu + 1);
    let o = 0;
    for (let k = 0; k < 6; k++) {
      cl.obj = 100 + L.id * 8 + k;
      const inner = k & 1, phi = L.twist + (k * Math.PI) / 3, cp = Math.cos(phi), sp = Math.sin(phi);
      const r0 = cp * e1[0] + sp * e2[0], r1 = cp * e1[1] + sp * e2[1], r2 = cp * e1[2] + sp * e2[2];
      const t0 = -sp * e1[0] + cp * e2[0], t1 = -sp * e1[1] + cp * e2[1], t2 = -sp * e1[2] + cp * e2[2];
      const len = 0.5 * s * (inner ? 1 : 1.05), W = (inner ? 0.165 : 0.125) * s, cup = inner ? 0.42 : 0.32;
      const a0 = lerp(0.12, 0.38, b), a1 = lerp(0.3, inner ? 2.0 : 2.15, b);
      let r = 0.014 * s, h = inner ? 0.006 : 0;
      for (let i = 0; i <= nu; i++) {
        const t = a0 + (a1 - a0) * Math.pow(i / nu, 1.7);
        rr[i] = r; hh[i] = h; th[i] = t;
        r += (Math.sin(t) * len) / nu; h += (Math.cos(t) * len) / nu;
      }
      for (let i = 0; i <= nu; i++) {
        const u = i / nu, ct = Math.cos(th[i]), st = Math.sin(th[i]);
        // the side of the tepal that looks into the flower
        const n0 = -ct * r0 + st * f[0], n1 = -ct * r1 + st * f[1], n2 = -ct * r2 + st * f[2];
        const w = W * Math.pow(Math.sin(Math.PI * Math.pow(u, 0.75)), 0.85);
        const bx = c[0] + f[0] * hh[i] + r0 * rr[i], by = c[1] + f[1] * hh[i] + r1 * rr[i], bz = c[2] + f[2] * hh[i] + r2 * rr[i];
        for (let j = 0; j <= nv; j++, o += 6) {
          const v = (j / nv) * 2 - 1, av = Math.abs(v);
          const lift = cup * v * v * w + 0.012 * s * Math.sin(u * 19 + v * 2 + k) * av * av * av - 0.008 * s * Math.exp(-(v * v) / 0.02) * (1 - u);
          const lv = v * w, sl = 2 * cup * v;
          cl.push(
            bx + t0 * lv + n0 * lift, by + t1 * lv + n1 * lift, bz + t2 * lv + n2 * lift,
            n0 - t0 * sl, n1 - t1 * sl, n2 - t2 * sl,
            cols[o], cols[o + 1], cols[o + 2], cols[o + 3], cols[o + 4], cols[o + 5], 0.9);
        }
      }
    }
    const fl = 0.42 * s * lerp(0.3, 1, b), spread = lerp(0.03, 0.17, b) * s;
    cl.obj = 100 + L.id * 8 + 6;
    for (let m = 0; m < 6; m++) {
      const ph = L.twist + ((m + 0.5) * Math.PI) / 3, cph = Math.cos(ph), sph = Math.sin(ph);
      const rd = add([cph * e1[0], cph * e1[1], cph * e1[2]], e2, sph);
      const tg = add([-sph * e1[0], -sph * e1[1], -sph * e1[2]], e2, cph);
      const path = t => { const g = spread * Math.pow(t, 1.6); return [c[0] + f[0] * fl * t + rd[0] * g, c[1] + f[1] * fl * t + rd[1] * g, c[2] + f[2] * fl * t + rd[2] * g]; };
      tube(cl, path, 0.0055 * s, C.filament, Math.ceil(16 * Q), 4, 0.2);
      ellipsoid(cl, path(1), tg, 0.042 * s, 0.015 * s, C.anther, 0.15, 8, 6);
    }
    const sl = 0.48 * s * lerp(0.3, 1, b);
    cl.obj = 100 + L.id * 8 + 7;
    const pistil = t => [c[0] + f[0] * sl * t + e2[0] * 0.04 * s * t * t, c[1] + f[1] * sl * t + e2[1] * 0.04 * s * t * t, c[2] + f[2] * sl * t + e2[2] * 0.04 * s * t * t];
    tube(cl, pistil, 0.008 * s, C.style, Math.ceil(18 * Q), 5, 0.3);
    ellipsoid(cl, pistil(1), f, 0.022 * s, 0.03 * s, C.stigma, 0.3, 7, 7);
  }

  // A garden rose: fifteen cupped petals on a golden-angle spiral, tight at the heart and
  // leaning open (with rolled-back lips) towards the outside.
  function rose(cl, Rz, bloom) {
    const f = Rz.f, c = Rz.c, s = Rz.size, [e1, e2] = basis(f), b = smooth(0, 1, bloom);
    const out = Rz.kind === 'red' ? C.red : C.blush, inn = Rz.kind === 'red' ? C.redIn : C.blushIn;
    const N = 15, nu = Math.ceil(10 * Q), nv = Math.ceil(12 * Q);
    for (let i = 0; i < N; i++) {
      cl.obj = 200 + Rz.id * 16 + i;
      const g = i / (N - 1), phi0 = i * 2.4 + Rz.twist, span = lerp(2.4, 1.5, g);
      const len = s * lerp(0.07, 0.15, g), r0 = s * lerp(0.008, 0.04, g), h0 = -s * 0.03 * g;
      const tilt = lerp(0.08, lerp(0.2, 1.2, g), b), curl = s * 0.05 * g * b;
      for (let iu = 0; iu <= nu; iu++) {
        for (let iv = 0; iv <= nv; iv++) {
          const v = (iv / nv) * 2 - 1, u = (iu / nu) * (1 - 0.22 * v * v);
          const th = tilt + 0.35 * u * u * g * b, st = Math.sin(th), ct = Math.cos(th);
          const rad = r0 + len * u * st + curl * u * u, hgt = h0 + len * u * ct;
          const ang = phi0 + v * span * 0.5, ca = Math.cos(ang), sa = Math.sin(ang);
          const d0 = e1[0] * ca + e2[0] * sa, d1 = e1[1] * ca + e2[1] * sa, d2 = e1[2] * ca + e2[2] * sa;
          const lip = smooth(0.75, 1, u) * 0.18;

      else if (phase === 'opening') { bloom += dt / 3.6; if (bloom >= 1) { bloom = 1; phase = 'open'; } }
      if (bloom !== lastBloom) { buildBlooms(bloom); lastBloom = bloom; dirty = true; }
      if (!REDUCE || dirty) { render(REDUCE ? 0 : t, yaw, pitch); dirty = false; }
    }
    requestAnimationFrame(frame);
  }

  stage.addEventListener('pointerdown', e => {
    dragging = true; moved = 0; lx = e.clientX; ly = e.clientY; lastMove = performance.now(); vel = 0;
    stage.setPointerCapture(e.pointerId);
    stage.classList.add('dragging');
  });
  stage.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = e.clientX - lx, dy = e.clientY - ly, now = performance.now();
    const dts = Math.max(0.008, (now - lastMove) / 1000);
    lx = e.clientX; ly = e.clientY; lastMove = now;
    moved += Math.abs(dx) + Math.abs(dy);
    yaw += dx * 0.009;
    vel = Math.max(-6, Math.min(6, lerp(vel, (dx * 0.009) / dts, 0.5)));
    pitch = Math.max(-0.05, Math.min(0.8, pitch + dy * 0.004));
    dirty = true;
  });
  const endDrag = () => {
    if (!dragging) return;
    dragging = false;
    stage.classList.remove('dragging');
    if (moved < 6) rebloom();
    if (performance.now() - lastMove > 90) vel = 0;
    dirty = true;
  };
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);
  stage.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') yaw -= 0.2;
    else if (e.key === 'ArrowRight') yaw += 0.2;
    else if (e.key === 'ArrowUp') pitch = Math.min(0.8, pitch + 0.08);
    else if (e.key === 'ArrowDown') pitch = Math.max(-0.05, pitch - 0.08);
    else if (e.key === 'Enter' || e.key === ' ') rebloom();
    else return;
    e.preventDefault();
    dirty = true;
  });

  let resizeTimer = 0, fontsDone = false;
  new ResizeObserver(() => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (fontsDone && layout()) { ready = true; dirty = true; } }, 100);
  }).observe(stage);

  const start = () => { if (fontsDone) return; fontsDone = true; ready = layout(); dirty = true; };
  const fontReady = document.fonts ? document.fonts.load(`500 12px "DM Mono"`) : Promise.resolve();
  Promise.race([fontReady, new Promise(r => setTimeout(r, 1500))]).catch(() => {}).then(start);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
